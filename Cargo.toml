[package]
name = "enote"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"

[dependencies]
iced = { version = "0.14.0", default-features = false, features = ["wgpu", "tiny-skia", "crisp", "web-colors", "thread-pool", "x11", "image-without-codecs", "advanced"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
tempfile = "3.27.0"
lucide-icons = "1.57.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
hayro = "0.8.0"
bytes = "1.11.1"
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }
roxmltree = "0.20.0"
cosmic-text = { version = "0.15.0", default-features = false, features = ["std", "swash"] }
encoding_rs = "0.8.35"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }

# PDF/image rasterizers need optimization even during local GUI development.
[profile.dev.package."*"]
opt-level = 2
